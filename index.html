<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Road to Doomsday | Marvel Watch Tracker</title>
<style>
  :root{
    --bg:#08080d;
    --panel:#12121b;
    --panel-2:#191925;
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.16);
    --txt:#eceef5;
    --dim:#8a8fa3;
    --dimmer:#5e6376;
    --accent:#13a34a;      /* Doom green */
    --accent-soft:#3fd47f;
    --gold:#f5c542;
    --p1:#4c8dff; --p2:#ff4d4d; --p3:#b06cff; --p4:#22c98f; --p5:#ffab2e; --p6:#ff5ea8;
    /* Fox X-Men */
    --x1:#f2a63b; --x2:#5ec9d8; --x3:#d4552f; --x4:#e0313a; --x5:#8b7fd4;
    /* Sony Spider-Man */
    --s1:#d92b3a; --s2:#2f8fd4; --s3:#7d4fbd; --s4:#e94aa0;
    /* animated X-Men + Netflix */
    --xa:#ffb020;
    --n1:#c0182a; --n2:#9aa1ad;
    /* universe accents */
    --u-mcu:#e62429; --u-xmen:#f2a63b; --u-sony:#2f8fd4; --u-netflix:#c0182a;
    --radius:14px;
    --a:#6ee7ff; /* player A accent */
    --b:#ff87c3; /* player B accent */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt)}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:0 0 80px;
  }
  /* Its own fixed layer. As `background-attachment:fixed` on the body this
     forced a full-viewport repaint every scroll frame, which was very visible
     on a phone. */
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      radial-gradient(900px 500px at 15% -8%, rgba(19,163,74,.26), transparent 60%),
      radial-gradient(800px 500px at 88% -12%, rgba(110,231,255,.13), transparent 60%);
  }
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{padding:34px 0 22px}
  .kicker{
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);
    font-weight:800;margin-bottom:8px;
  }
  h1{
    font-size:clamp(30px,5.5vw,52px);line-height:1;font-weight:900;letter-spacing:-.02em;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .sub{color:var(--dim);margin-top:10px;font-size:14px}

  .hero{
    display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end;
    padding-bottom:22px;border-bottom:1px solid var(--line);
  }
  .countdown{text-align:right}
  .cd-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dimmer);font-weight:700}
  .cd-num{font-size:clamp(32px,7vw,58px);font-weight:900;line-height:1;letter-spacing:-.03em;
    background:linear-gradient(180deg,#fff,var(--accent-soft));-webkit-background-clip:text;background-clip:text;color:transparent}
  .cd-sub{font-size:12px;color:var(--dim);margin-top:4px}

  /* ---------- progress bar ---------- */
  .progress-block{margin:22px 0 6px}
  .pb-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .pb-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .pb-count b{font-size:20px;font-weight:900}
  .pb-count span{color:var(--dim);font-size:13px}
  .track{height:10px;border-radius:99px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);display:flex}
  .track i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.9,.25,1)}

  /* ---------- tabs / toolbar ---------- */
  .toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin:26px 0 18px;padding-bottom:0;
  }
  .tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px}
  .tab{
    border:0;background:transparent;color:var(--dim);font:inherit;font-weight:700;font-size:13px;
    padding:8px 18px;border-radius:99px;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .tab:hover{color:var(--txt)}
  .tab.on{background:var(--accent);color:#02160a}
  .spacer{flex:1}
  .ctrl{
    background:var(--panel);border:1px solid var(--line);color:var(--txt);font:inherit;font-size:13px;
    padding:9px 12px;border-radius:10px;cursor:pointer;transition:.15s;font-weight:600;
  }
  .ctrl:hover{border-color:var(--line-2);background:var(--panel-2)}
  select.ctrl{padding-right:28px;appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
    background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;
    background-size:5px 5px,5px 5px;background-repeat:no-repeat}

  /* ---------- name pills ---------- */
  .names{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .namepill{
    display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    border-radius:99px;padding:6px 13px 6px 10px;
  }
  .namepill .swatch{
    width:16px;height:16px;flex:none;padding:0;cursor:pointer;
    border:1px solid var(--line-2);border-radius:50%;background:none;
    -webkit-appearance:none;appearance:none;
  }
  .swatch::-webkit-color-swatch-wrapper{padding:0}
  .swatch::-webkit-color-swatch{border:none;border-radius:50%}
  .swatch::-moz-color-swatch{border:none;border-radius:50%}
  .namepill input{
    background:transparent;border:0;color:var(--txt);font:inherit;font-weight:700;font-size:13px;
    width:78px;outline:none;padding:0;
  }
  .namepill input:focus{color:var(--gold)}

  /* ---------- sync pill + share box ---------- */
  .shareBtn{
    border-color:rgba(19,163,74,.5);color:var(--accent-soft);font-weight:700;
  }
  .shareBtn:hover{border-color:var(--accent);background:rgba(19,163,74,.12)}
  .syncpill[hidden]{display:none}
  #sharebox[hidden]{display:none}
  .syncpill .caret{
    font-weight:900;font-size:13px;line-height:1;opacity:.55;
    transform:rotate(90deg);transition:transform .18s;
  }
  .syncpill.open .caret{transform:rotate(-90deg)}
  .syncpill{
    font:inherit;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:6px 13px;
    background:var(--panel);border:1px solid var(--line);
    font-size:12px;font-weight:700;color:var(--dim);white-space:nowrap;
  }
  .syncpill i{width:8px;height:8px;border-radius:50%;background:var(--dimmer);flex:none}
  .syncpill.shared{border-color:rgba(34,201,143,.45);color:#3ee0a3}
  .syncpill.shared i{background:#22c98f;box-shadow:0 0 8px #22c98f}
  .syncpill.connecting i{background:var(--gold);animation:pulse 1s ease-in-out infinite}
  .syncpill.error{border-color:rgba(255,77,77,.45);color:#ff8080}
  .syncpill.error i{background:#ff4d4d}
  @keyframes pulse{50%{opacity:.25}}

  #sharebox:not(:empty){
    margin:0 0 22px;padding:15px 16px;border-radius:var(--radius);
    background:var(--panel);border:1px solid var(--line);
  }
  .share-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .share-link{
    flex:1;min-width:220px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font:inherit;font-size:12.5px;padding:9px 12px;outline:none;
  }
  .share-link:focus{border-color:var(--accent)}
  .share-note{margin-top:9px;font-size:11.5px;color:var(--dimmer);line-height:1.5}
  .share-note b{color:var(--gold);letter-spacing:.06em}

  /* ---------- phase heading ---------- */
  .phase-head{
    display:flex;align-items:center;gap:12px;margin:30px 0 14px;
  }
  .phase-head .bar{width:4px;height:26px;border-radius:2px}
  .phase-head h2{font-size:15px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
  .phase-head .meta{color:var(--dimmer);font-size:12px;font-weight:600;margin-left:auto}

  /* ---------- movie grid ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(470px,1fr));gap:14px}
  .card{
    position:relative;display:grid;
    grid-template-columns:178px 1fr;
    grid-template-areas:"poster body"
                        "poster foot";
    align-content:start;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;transition:border-color .18s, transform .18s;
    /* don't lay out or paint cards that aren't near the viewport; `auto` lets
       the browser remember each card's real height so scrolling stays stable */
    content-visibility:auto;
    contain-intrinsic-size:auto 315px;   /* measured median card height */
  }
  .card::before{
    content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--pc);z-index:3;
  }
  @media(hover:hover){
    .card:hover{border-color:var(--line-2);transform:translateY(-2px)}
  }
  .card.watched{background:linear-gradient(180deg,rgba(34,201,143,.07),transparent 55%),var(--panel)}
  .card.watched::before{box-shadow:0 0 14px var(--pc)}

  /* ---------- poster ---------- */
  .poster{
    grid-area:poster;
    position:relative;width:175px;margin-left:3px;overflow:hidden;
    background:var(--panel-2);
  }
  .poster img{
    position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(.45) brightness(.62);transition:filter .35s ease;
  }
  .card.watched .poster img{filter:none}
  .poster img.gone{display:none}
  /* several TV articles use landscape key art; cropping it to a portrait slot
     leaves an unreadable centre strip, so letterbox those instead */
  .poster img.wide,.lbposter img.wide{object-fit:contain;background:#0b0b12}
  .pfall{
    position:absolute;inset:0;z-index:0;display:grid;place-items:center;text-align:center;padding:10px;
    font-size:10.5px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;line-height:1.3;
    color:rgba(255,255,255,.92);background:linear-gradient(155deg,var(--pc),rgba(0,0,0,.92) 88%);
  }
  .pbadge{
    position:absolute;z-index:2;top:7px;right:7px;width:19px;height:19px;border-radius:50%;
    background:#22c98f;color:#04150e;display:grid;place-items:center;font-size:11px;font-weight:900;
    box-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .cbody{grid-area:body;min-width:0;padding:15px 15px 0 14px}
  .cfoot{grid-area:foot;min-width:0;padding:11px 15px 13px 14px}

  .c-top{display:flex;gap:12px;align-items:flex-start}
  .num{
    font-size:11px;font-weight:900;color:var(--dimmer);font-variant-numeric:tabular-nums;
    min-width:22px;padding-top:3px;
  }
  .c-title{flex:1;min-width:0}
  /* Card height drove poster height, and titles ran from 1 to 6 lines, so
     posters came out 11 different sizes. Pin the text block instead. */
  .c-title h3{
    font-size:15.5px;font-weight:800;line-height:1.25;letter-spacing:-.01em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:2.5em;
  }
  .c-meta{
    font-size:11.5px;color:var(--dimmer);margin-top:3px;font-weight:600;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .c-meta .setin{color:var(--gold);font-weight:800}
  .combo{
    flex:none;text-align:center;min-width:44px;padding:5px 6px;border-radius:9px;
    background:var(--panel-2);border:1px solid var(--line);
  }
  .combo b{display:block;font-size:17px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .combo span{font-size:8.5px;letter-spacing:.12em;color:var(--dimmer);font-weight:800;text-transform:uppercase}
  .combo.empty b{color:var(--dimmer);font-size:15px}

  .watchrow{display:flex;align-items:center;gap:8px;margin:13px 0 4px}
  .wbtn{
    display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);
    color:var(--dim);font:inherit;font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;cursor:pointer;transition:.15s;
  }
  .wbtn:hover{border-color:var(--line-2);color:var(--txt)}
  .wbtn.on{background:rgba(34,201,143,.15);border-color:rgba(34,201,143,.45);color:#3ee0a3}
  .wbtn .chk{width:13px;height:13px;border-radius:4px;border:1.5px solid currentColor;display:grid;place-items:center;font-size:9px;line-height:1}

  .scores{margin:10px 0 0;display:flex;flex-direction:column;gap:12px}
  /* Name and running score sit on their own line so the pips get the card's
     full width. Sharing that row squeezed each pip to about 11px across. */
  .srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sname{
    order:1;flex:1 1 auto;min-width:0;
    font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    letter-spacing:.02em;
  }
  .track-wrap{order:3;flex:1 1 100%;display:flex;align-items:center;gap:10px}

  /* one range input per person, in tenths */
  .slider{
    flex:1;min-width:0;-webkit-appearance:none;appearance:none;
    background:transparent;height:28px;margin:0;padding:0;cursor:pointer;
  }
  .slider::-webkit-slider-runnable-track{
    height:10px;border-radius:99px;border:1px solid var(--line);
    background:linear-gradient(90deg,var(--sc) var(--fill),var(--panel-2) var(--fill));
  }
  .slider::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;margin-top:-7px;
    background:#f6f8ff;border:2.5px solid var(--sc);
    box-shadow:0 2px 6px rgba(0,0,0,.55);transition:transform .1s;
  }
  .slider::-moz-range-track{
    height:10px;border-radius:99px;border:1px solid var(--line);
    background:linear-gradient(90deg,var(--sc) var(--fill),var(--panel-2) var(--fill));
  }
  .slider::-moz-range-thumb{
    width:20px;height:20px;border-radius:50%;
    background:#f6f8ff;border:2.5px solid var(--sc);
    box-shadow:0 2px 6px rgba(0,0,0,.55);
  }
  .slider:active::-webkit-slider-thumb{transform:scale(1.15)}
  .slider:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:99px}

  /* nothing scored yet: keep the handle visible but clearly inert */
  .srow.unrated .slider{--sc:var(--line-2)}
  .srow.unrated .slider::-webkit-slider-thumb{background:var(--panel-2);border-color:var(--line-2)}
  .srow.unrated .slider::-moz-range-thumb{background:var(--panel-2);border-color:var(--line-2)}
  .srow.unrated .sval{color:var(--dimmer)}
  .srow.unrated .clr{visibility:hidden}

  .clr{
    flex:none;width:26px;height:26px;border-radius:50%;padding:0;line-height:1;
    background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
    font-size:16px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .clr:hover{border-color:var(--line-2);color:var(--txt)}

  .diff{
    margin:9px 0 0;font-size:11px;font-weight:700;color:var(--gold);
    display:flex;align-items:center;gap:6px;
  }
  .diff.hidden{visibility:hidden}

  /* ---------- leaderboard ---------- */
  .lb{display:flex;flex-direction:column;gap:6px}
  .lbrow{
    display:grid;grid-template-columns:34px 38px 1fr auto auto auto;gap:14px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 15px;
  }
  .lbposter{
    position:relative;width:38px;height:56px;border-radius:5px;overflow:hidden;background:var(--panel-2);
  }
  .lbposter img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block}
  .lbposter img.gone{display:none}
  .lbposter .pfall{font-size:7px;letter-spacing:.03em;padding:3px}
  .lbrow:hover{border-color:var(--line-2)}
  .rank{font-size:16px;font-weight:900;color:var(--dimmer);font-variant-numeric:tabular-nums}
  .lbrow:nth-child(1) .rank{color:var(--gold)}
  .lbrow:nth-child(2) .rank{color:#cfd4e0}
  .lbrow:nth-child(3) .rank{color:#c98a4b}
  .lbtitle{font-weight:700;font-size:14px}
  .lbtitle small{display:block;color:var(--dimmer);font-size:11px;font-weight:600;margin-top:2px}
  .chip{
    font-size:12px;font-weight:900;padding:4px 9px;border-radius:7px;min-width:38px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .chip.a{background:rgba(110,231,255,.13);color:var(--a)}
  .chip.b{background:rgba(255,135,195,.13);color:var(--b)}
  .chip.tot{background:var(--gold);color:#000;min-width:46px;font-size:14px}

  /* ---------- stats ---------- */
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:26px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .stat .k{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--dimmer);font-weight:800}
  .stat .v{font-size:30px;font-weight:900;line-height:1.1;margin-top:8px;letter-spacing:-.02em}
  .stat .n{font-size:12px;color:var(--dim);margin-top:4px}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .panelbox h3{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);font-weight:800;margin-bottom:14px}
  .barlist{display:flex;flex-direction:column;gap:11px}
  .barline{display:grid;grid-template-columns:1fr;gap:5px}
  .barline .bl-top{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;gap:10px}
  .barline .bl-top span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  .minitrack{height:7px;background:var(--panel-2);border-radius:99px;overflow:hidden}
  .minitrack i{display:block;height:100%;border-radius:99px}

  .empty-note{color:var(--dimmer);font-size:13.5px;text-align:center;padding:44px 20px;line-height:1.7}

  .footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);color:var(--dimmer);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}

  .hide{display:none!important}
  @media(max-width:640px){
    .hero{grid-template-columns:1fr}
    .countdown{text-align:left}
    .grid{grid-template-columns:1fr}

    /* The poster still fills its cell edge to edge, but the scores drop to
       their own full-width row underneath so they no longer stretch the
       poster cell taller and taller. */
    .card{
      grid-template-columns:96px 1fr;
      grid-template-areas:"poster body"
                          "foot   foot";
      /* measured median on a 375px viewport; a low guess here makes the page
         grow as you scroll, which reads as the scroll position jumping */
      contain-intrinsic-size:auto 362px;
    }
    .poster{width:93px}
    .num{display:none}                       /* the list order is obvious enough */
    .c-title h3{-webkit-line-clamp:3;min-height:3.75em}
    .cbody{padding:14px 13px 13px 12px}
    .cfoot{padding:2px 14px 14px 14px}

    .scores{gap:15px;margin-top:0}
    .srow{gap:6px}
    .sname{font-size:12px}
    .slider{height:34px}                       /* taller grab area for a thumb */
    .slider::-webkit-slider-thumb{width:26px;height:26px;margin-top:-9px}
    .slider::-moz-range-thumb{width:24px;height:24px}
    .clr{width:30px;height:30px}
    .wbtn{padding:9px 15px;font-size:13px}
    .lbrow{grid-template-columns:26px 32px 1fr auto;gap:10px}
    .lbposter{width:32px;height:47px}
    .lbrow .chip.a,.lbrow .chip.b{display:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hero">
      <div>
        <div class="kicker">MCU · Fox X-Men · Sony Spider-Man</div>
        <h1>Road to <em>Doomsday</em></h1>
        <p class="sub">Every film and series, in order. Two opinions. One scoreboard.</p>
      </div>
      <div class="countdown">
        <div class="cd-label">Days until Doomsday</div>
        <div class="cd-num" id="cdNum">...</div>
        <div class="cd-sub" id="cdSub">December 18, 2026</div>
      </div>
    </div>

    <div class="progress-block">
      <div class="pb-top">
        <div class="pb-title">Progress</div>
        <div class="pb-count"><b id="pcWatched">0</b> <span>/ <span id="pcTotal">0</span> watched · <span id="pcHours">0h</span> logged · <span id="pcLeft">0h</span> to go</span></div>
      </div>
      <div class="track" id="track"></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab on" data-view="movies">Movies</button>
      <button class="tab" data-view="leaderboard">Leaderboard</button>
      <button class="tab" data-view="stats">Stats</button>
    </div>
    <div class="names">
      <label class="namepill"><input type="color" class="swatch" id="colorA" title="Pick a colour"><input id="nameA" class="nameinput" maxlength="12" spellcheck="false"></label>

const KEY = "mcu-doomsday-tracker-v1";
const DEFAULT_COLORS = {a:"#6ee7ff", b:"#ff87c3"};
const blank = () => ({ names:{a:"Me", b:"Her"}, colors:{...DEFAULT_COLORS}, scores:{}, watched:{},
                       order:"release", filter:"all", universe:"all", format:"all" });

/* ---------- shared board ----------
   With no room in the URL this behaves exactly as before: everything lives in
   localStorage on this one device. With #r=CODE it mirrors a room on the
   server. Edits apply locally first so the UI never waits on the network, then
   go out as one small op. Polling pulls in whatever the other person did. */
const ROOM = (location.hash.match(/[#&]r=([A-Za-z0-9-]{8,9})/) || [])[1] || null;
const SYNC = { room: ROOM, status: ROOM ? "connecting" : "local", pulling: false, flushing: false, queue: [] };
const POLL_MS = 8000;

const cacheKey = () => SYNC.room ? `${KEY}:room:${SYNC.room}` : KEY;

let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(cacheKey()) || "{}")); }
catch(e){ S = blank(); }
S.names  = Object.assign({a:"Me",b:"Her"}, S.names||{});
S.colors = Object.assign({...DEFAULT_COLORS}, S.colors||{});
S.scores = S.scores||{}; S.watched = S.watched||{}; S.universe = S.universe||"all"; S.format = S.format||"all";

/* localStorage is the source of truth when local, a fast-paint cache when shared */
const save = () => { try { localStorage.setItem(cacheKey(), JSON.stringify(S)); } catch(e){} };

/* Edits queue up and drain to the server in order. Anything that fails to send
   stays queued, and pull() refuses to run while the queue is non-empty, so a
   dropped connection can never let a poll overwrite work you have not sent. */
const MAX_QUEUE = 500;

function push(...ops){
  if (!SYNC.room) return;
  SYNC.queue.push(...ops);
  if (SYNC.queue.length > MAX_QUEUE) SYNC.queue.splice(0, SYNC.queue.length - MAX_QUEUE);
  return flush();
}

async function flush(){
  if (!SYNC.room || SYNC.flushing || !SYNC.queue.length) return;
  SYNC.flushing = true;
  const batch = SYNC.queue.slice();
  try{
    const res = await fetch("/api/op", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ code: SYNC.room, ops: batch })
    });
    if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || res.status);
    SYNC.queue.splice(0, batch.length);   // only drop what this call actually sent
    setStatus("shared");
  }catch(err){
    console.warn("sync failed, will retry", err);
    setStatus("error");
  }finally{
    SYNC.flushing = false;
  }
}

const getScore = (id,who) => (S.scores[id]||{})[who] ?? null;
const SCORE_MIN = 1, SCORE_MAX = 10;
const roundTenth = v => Math.round(v*10)/10;
const fillPct = v => v==null ? 0 : ((v-SCORE_MIN)/(SCORE_MAX-SCORE_MIN))*100;
const applyColors = () => {
  document.documentElement.style.setProperty("--a", S.colors.a);
  document.documentElement.style.setProperty("--b", S.colors.b);
};
/* `v` is a number in tenths, or null to clear. `quiet` skips the server op so a
   drag can update locally on every frame and send once on release. */
const setScore = (id, who, v, quiet) => {
  S.scores[id] = S.scores[id] || {};
  if (v === null) delete S.scores[id][who];
  else S.scores[id][who] = roundTenth(v);
  if (Object.keys(S.scores[id]).length) S.watched[id] = true;
  save();
  applyEdit(id);
  if (!quiet) push({t:"score", id, who, v: v === null ? null : roundTenth(v)});
};
const combo = id => {
  const a = getScore(id,"a"), b = getScore(id,"b");
  if (a==null && b==null) return null;
  if (a==null) return b;
  if (b==null) return a;
  return (a+b)/2;
};
const fmt1 = n => (Math.round(n*10)/10).toFixed(1).replace(/\.0$/,".0");

/* score → color ramp (red 1 → amber 5 → green 10) */
function scoreColor(v){
  const h = (v-1)/9 * 130;           // 0 red → 130 green
  return `hsl(${h} 78% ${v>=8?52:48}%)`;
}

/* every film in the selected universe, before watch/score filtering */
function activeFilms(){
  return FILMS.filter(f =>
    (S.universe === "all" || uOf(f) === S.universe) &&
    (S.format   === "all" || (S.format === "series") === isSeries(f)));
}
/* Each universe carries its own hand-ordered chronology in `tl`, so timeline
   mode sorts within a universe rather than pretending they share a timeline. */
const U_RANK = {mcu:0, xmen:1, sony:2, netflix:3};
function sortedFilms(){
  const list = activeFilms();
  if (S.order === "timeline"){
    list.sort((x,y) =>
      U_RANK[uOf(x)] - U_RANK[uOf(y)] || (x.tl - y.tl) || (x.y - y.y));
  } else if (S.order === "story"){
    // every film interleaved by the year it is set in, universes ignored
    list.sort((x,y) => (x.sy - y.sy)
      || (uOf(x) === uOf(y) ? x.tl - y.tl : 0)
      || (x.y - y.y) || x.t.localeCompare(y.t));
  }
  return list;
}
function passFilter(f){
  const w = !!S.watched[f.id], a = getScore(f.id,"a"), b = getScore(f.id,"b");
  switch(S.filter){
    case "watched":   return w;
    case "unwatched": return !w;
    case "unscored":  return a==null || b==null;
    default:          return true;
  }
}

          <div class="sval" style="${v==null?"":`color:${scoreColor(v)}`}">${v==null?"-":fmt1(v)}</div>
          <div class="track-wrap">
            <input type="range" class="slider" min="${SCORE_MIN}" max="${SCORE_MAX}" step="0.1"
                   value="${v ?? (SCORE_MIN+SCORE_MAX)/2}"
                   data-id="${f.id}" data-who="${who}"
                   aria-label="${esc(S.names[who])} score for ${esc(f.t)}"
                   style="--fill:${fillPct(v)}%;--sc:var(--${who})">
            <button class="clr" data-clr="${f.id}" data-who="${who}" title="Clear this score">&times;</button>
          </div>
        </div>`;
  };

  return `
  <article class="card${w?" watched":""}" data-card="${f.id}" style="--pc:${GROUPS[f.g].color}">
    <div class="poster">
      <div class="pfall">${esc(f.t)}</div>
      <img src="posters/${f.id}.webp" alt="${esc(f.t)} poster" decoding="async"
           loading="eager" fetchpriority="${eager?"high":"low"}"
           onerror="this.classList.add('gone')"
           onload="if(this.naturalWidth>=this.naturalHeight)this.classList.add('wide')">
      ${w?`<div class="pbadge" title="Watched">✓</div>`:""}
    </div>

    <div class="cbody">
      <div class="c-top">
        <div class="num">${String(idx).padStart(2,"0")}</div>
        <div class="c-title">
          <h3 title="${esc(f.t)}">${f.t}</h3>
          <div class="c-meta">${S.order==="story"
            ? `<b class="setin">Set in ${f.sy}</b> · ${UNIVERSES[uOf(f)].short}${isSeries(f)?` · ${f.eps} eps`:""}`
            : `${f.y} · ${isSeries(f)?`${f.eps} ep${f.eps===1?"":"s"} · `:""}${hrs(f.r)}`} </div>
        </div>
        <div class="combo${c==null?" empty":""}">
          <b style="${c!=null?`color:${scoreColor(c)}`:""}">${c==null?"-":fmt1(c)}</b>
          <span>score</span>
        </div>
      </div>

      <div class="watchrow">
        <button class="wbtn${w?" on":""}" data-watch="${f.id}">
          <span class="chk">${w?"✓":""}</span>${w?"Watched":"Mark watched"}
        </button>
      </div>
    </div>

    <div class="cfoot">
      <div class="scores">${scoreRow("a")}${scoreRow("b")}</div>

      <div class="diff${gap==null||gap<3?" hidden":""}">
        ⚡ ${gap} points apart. ${gap>=6?"Take it outside.":"Debate required."}
      </div>
    </div>
  </article>`;
}

function renderMovies(){
  painted = 0;
  const list = sortedFilms().filter(passFilter);
  const el = $("#view-movies");
  if (!list.length){ el.innerHTML = `<div class="empty-note">Nothing matches that filter.</div>`; return; }

  // index numbers always reflect the active ordering across ALL films
  const posMap = new Map(sortedFilms().map((f,i)=>[f.id,i+1]));

  const section = (color, title, note, films, gid) => `
      <div class="phase-head"${gid?` data-g="${gid}"`:""}>
        <div class="bar" style="background:${color}"></div>
        <h2>${title}</h2>
        <div class="meta">${note}</div>
      </div>
      <div class="grid">${films.map(f=>cardHTML(f,posMap.get(f.id))).join("")}</div>`;

  let out = "";

  if (S.order === "story"){
    const ys = list.map(f=>f.sy);
    out += section("var(--gold)", "Everything by story year",
      `${list.length} film${list.length===1?"":"s"}, ${Math.min(...ys)} to ${Math.max(...ys)}`, list);
    el.innerHTML = out;
    return;
  }

  if (S.order === "timeline"){
    for (const u of ["mcu","xmen","sony","netflix"]){
      const inU = list.filter(f=>uOf(f)===u);
      if (!inU.length) continue;
      const note = `${inU.length} title${inU.length===1?"":"s"} in story order`;
      out += section(`var(--u-${u})`, UNIVERSES[u].name, note, inU);
    }
    el.innerHTML = out;
    return;
  }

  for (const gid of GROUP_ORDER){
    const inGroup = list.filter(f=>f.g===gid);
    if (!inGroup.length) continue;
    const all  = FILMS.filter(f=>f.g===gid);
    const done = all.filter(f=>S.watched[f.id]).length;
    out += section(GROUPS[gid].color, GROUPS[gid].name, `${done}/${all.length} watched`, inGroup, gid);
  }
  el.innerHTML = out;
}

function renderLeaderboard(){
  painted = 0;
  const scored = activeFilms().filter(f=>combo(f.id)!=null)
                              .sort((x,y)=>combo(y.id)-combo(x.id));
  const el = $("#view-leaderboard");
  if (!scored.length){
    el.innerHTML = `<div class="empty-note">No scores yet.<br>Rate a film on the Movies tab and the rankings show up here.</div>`;
    return;
  }
  el.innerHTML = `<div class="lb">` + scored.map((f,i)=>{
    const a=getScore(f.id,"a"), b=getScore(f.id,"b");
    return `<div class="lbrow">
      <div class="rank">${i+1}</div>
      <div class="lbposter" style="--pc:${GROUPS[f.g].color}">
        <div class="pfall">${esc(f.t)}</div>
        <img src="posters/${f.id}.webp" alt="" loading="lazy" decoding="async" onerror="this.classList.add('gone')"
             onload="if(this.naturalWidth>=this.naturalHeight)this.classList.add('wide')">
      </div>
      <div class="lbtitle">${f.t}<small>${f.y} · ${UNIVERSES[uOf(f)].short} · ${GROUPS[f.g].short}</small></div>
      <div class="chip a">${a??"-"}</div>
      <div class="chip b">${b??"-"}</div>
      <div class="chip tot" style="background:${scoreColor(combo(f.id))}">${fmt1(combo(f.id))}</div>
    </div>`;
  }).join("") + `</div>`;
}

function renderStats(){
  const el = $("#view-stats");
  const pool = activeFilms();
  const watched = pool.filter(f=>S.watched[f.id]);
  const mins = watched.reduce((s,f)=>s+f.r,0);
  const aVals = pool.map(f=>getScore(f.id,"a")).filter(v=>v!=null);
  const bVals = pool.map(f=>getScore(f.id,"b")).filter(v=>v!=null);
  const both  = pool.filter(f=>getScore(f.id,"a")!=null && getScore(f.id,"b")!=null);
  const avg = arr => arr.length ? arr.reduce((s,v)=>s+v,0)/arr.length : null;

  const gaps = both.map(f=>({f, g:Math.abs(getScore(f.id,"a")-getScore(f.id,"b"))}))
                   .sort((x,y)=>y.g-x.g);
  const agree = both.length ? Math.round((1 - avg(gaps.map(x=>x.g))/9) * 100) : null;

  const aFav = aVals.length ? pool.filter(f=>getScore(f.id,"a")===Math.max(...aVals)) : [];
  const bFav = bVals.length ? pool.filter(f=>getScore(f.id,"b")===Math.max(...bVals)) : [];

  const stat = (k,v,n,color) =>
    `<div class="stat"><div class="k">${k}</div><div class="v"${color?` style="color:${color}"`:""}>${v}</div><div class="n">${n}</div></div>`;

  let html = `<div class="statgrid">
    ${stat("Titles watched", `${watched.length}<span style="font-size:16px;color:var(--dimmer)">/${pool.length}</span>`,
           `${pool.length - watched.length} left before Doomsday`)}
    ${stat("Time together", bigHrs(mins), `${Math.round(mins/60/24*10)/10} days of Marvel`)}
    ${stat(esc(S.names.a)+" · avg score", aVals.length?fmt1(avg(aVals)):"-",
           `${aVals.length} film${aVals.length===1?"":"s"} rated`, aVals.length?scoreColor(avg(aVals)):null)}
    ${stat(esc(S.names.b)+" · avg score", bVals.length?fmt1(avg(bVals)):"-",
           `${bVals.length} film${bVals.length===1?"":"s"} rated`, bVals.length?scoreColor(avg(bVals)):null)}
    ${stat("Agreement", agree!=null?agree+"%":"-",
           both.length?`across ${both.length} film${both.length===1?"":"s"} you both rated`:"rate the same film to compare",
           agree!=null?scoreColor(agree/10):null)}
  </div>`;

  // average score per saga
  const sagaRows = GROUP_ORDER.map(gid=>{
    const fs = pool.filter(f=>f.g===gid && combo(f.id)!=null);
    if (!fs.length) return null;
    const v = avg(fs.map(f=>combo(f.id)));
    return `<div class="barline">
      <div class="bl-top"><span>${GROUPS[gid].name}</span><span>${fmt1(v)} · ${fs.length} rated</span></div>
      <div class="minitrack"><i style="width:${v*10}%;background:${GROUPS[gid].color}"></i></div>
    </div>`;
  }).filter(Boolean).join("");

  if (sagaRows) html += `<div class="panelbox"><h3>Average score by saga</h3><div class="barlist">${sagaRows}</div></div>`;

  // head to head across universes, only when more than one is in play
  const uRows = ["mcu","xmen","sony","netflix"].map(u=>{
    const fs = pool.filter(f=>uOf(f)===u && combo(f.id)!=null);
    if (!fs.length) return null;
    const v = avg(fs.map(f=>combo(f.id)));
    return `<div class="barline">
      <div class="bl-top"><span>${UNIVERSES[u].name}</span><span>${fmt1(v)} · ${fs.length} rated</span></div>
      <div class="minitrack"><i style="width:${v*10}%;background:var(--u-${u})"></i></div>
    </div>`;
  }).filter(Boolean);

  if (uRows.length > 1)
    html += `<div class="panelbox"><h3>Universe head to head</h3><div class="barlist">${uRows.join("")}</div></div>`;

  if (gaps.length){
    const top = gaps.filter(x=>x.g>0).slice(0,5);
    if (top.length){
      html += `<div class="panelbox"><h3>Biggest disagreements</h3><div class="barlist">` +
        top.map(x=>`<div class="barline">
          <div class="bl-top"><span>${x.f.t}</span>
          <span><span style="color:var(--a)">${getScore(x.f.id,"a")}</span> vs <span style="color:var(--b)">${getScore(x.f.id,"b")}</span> · ${x.g} apart</span></div>
          <div class="minitrack"><i style="width:${x.g/9*100}%;background:var(--gold)"></i></div>
        </div>`).join("") + `</div></div>`;
    } else {
      html += `<div class="panelbox"><h3>Biggest disagreements</h3>
        <div style="color:var(--dim);font-size:13.5px">Perfect agreement on every film so far. Suspicious.</div></div>`;
    }
  }

  if (aFav.length || bFav.length){
    html += `<div class="panelbox"><h3>Personal favourites</h3><div class="barlist">
      ${aFav.length?`<div class="barline"><div class="bl-top"><span style="color:var(--a)">${esc(S.names.a)}</span><span style="color:var(--txt);text-align:right">${aFav.map(f=>f.t).join(", ")} · ${Math.max(...aVals)}/10</span></div></div>`:""}
      ${bFav.length?`<div class="barline"><div class="bl-top"><span style="color:var(--b)">${esc(S.names.b)}</span><span style="color:var(--txt);text-align:right">${bFav.map(f=>f.t).join(", ")} · ${Math.max(...bVals)}/10</span></div></div>`:""}
    </div></div>`;
  }

  el.innerHTML = html;
}

/* Rebuilding every card on each click also rebuilt all 84 <img> elements, and
   a fresh <img> has to decode again even when the bytes are cached, which
   showed up as posters flickering. Touch only what changed instead. */
function updateCard(id){
  const f = FILMS.find(x => x.id === id);
  const card = document.querySelector(`.card[data-card="${id}"]`);
  if (!f || !card) return false;

  const w = !!S.watched[id], c = combo(id);
  const a = getScore(id,"a"), b = getScore(id,"b");

  card.classList.toggle("watched", w);

  const poster = card.querySelector(".poster");
  let badge = poster.querySelector(".pbadge");
  if (w && !badge){
    badge = document.createElement("div");
    badge.className = "pbadge"; badge.title = "Watched"; badge.textContent = "✓";
    poster.appendChild(badge);
  } else if (!w && badge){
    badge.remove();
  }

  const combined = card.querySelector(".combo");
  combined.classList.toggle("empty", c == null);
  const cb = combined.querySelector("b");
  cb.textContent = c == null ? "-" : fmt1(c);
  cb.style.color = c != null ? scoreColor(c) : "";

  const wbtn = card.querySelector(".wbtn");
  wbtn.classList.toggle("on", w);
  wbtn.innerHTML = `<span class="chk">${w?"✓":""}</span>${w?"Watched":"Mark watched"}`;

  for (const who of ["a","b"]){
    const v = getScore(id, who);
    const row = card.querySelector(`.srow[data-who="${who}"]`);
    if (!row) continue;
    row.classList.toggle("unrated", v == null);
    row.querySelector(".sval").textContent = v == null ? "-" : fmt1(v);
    const sval = row.querySelector(".sval");
    sval.style.color = v == null ? "" : scoreColor(v);
    const sl = row.querySelector(".slider");
    sl.style.setProperty("--fill", fillPct(v) + "%");
    // don't fight the thumb the user is currently dragging
    if (document.activeElement !== sl && v != null) sl.value = v;
    if (v == null) sl.value = (SCORE_MIN + SCORE_MAX) / 2;
  }

  const gap = (a != null && b != null) ? Math.abs(a-b) : null;
  const diff = card.querySelector(".diff");
  diff.classList.toggle("hidden", gap == null || gap < 3);
  if (gap != null){
    diff.textContent = `⚡ ${gap} points apart. ${gap>=6?"Take it outside.":"Debate required."}`;
  }
  return true;
}

/* section headings carry a watched tally that a single edit can change */
/* The player name appears on every card, but it is the only thing that
   changes, so swap the labels instead of rebuilding the list. Re-rendering on
   each keystroke threw away all 84 <img> elements and made posters flicker. */
function updateNames(){
  for (const who of ["a","b"]){
    document.querySelectorAll(`.srow[data-who="${who}"] .sname`)
      .forEach(el => { el.textContent = S.names[who]; });
  }
}

function updateGroupCounts(){
  document.querySelectorAll(".phase-head[data-g]").forEach(head => {
    const gid = head.dataset.g;
    const all = FILMS.filter(x => x.g === gid);
    const done = all.filter(x => S.watched[x.id]).length;
    head.querySelector(".meta").textContent = `${done}/${all.length} watched`;
  });
}

/* Full render only when the edit changes which cards belong on screen. */
function applyEdit(id){
  const f = FILMS.find(x => x.id === id);
  const stillListed = VIEW === "movies" && f && passFilter(f) &&
                      (S.universe === "all" || uOf(f) === S.universe) &&
                      (S.format === "all" || (S.format === "series") === isSeries(f));
  if (!stillListed || !updateCard(id)){ render(); return; }
  renderHeader();
  updateGroupCounts();
}

function renderHeader(){
  const pool = activeFilms();
  const watched = pool.filter(f=>S.watched[f.id]);
  const mins = watched.reduce((s,f)=>s+f.r,0);
  const left = pool.filter(f=>!S.watched[f.id]).reduce((s,f)=>s+f.r,0);
  $("#pcWatched").textContent = watched.length;
  $("#pcTotal").textContent   = pool.length;
  $("#pcHours").textContent   = bigHrs(mins);
  $("#pcLeft").textContent    = bigHrs(left);

  // one track segment per saga in play
  $("#track").innerHTML = GROUP_ORDER.map(gid=>{
    const all = pool.filter(f=>f.g===gid);
    if (!all.length) return "";
    const done = all.filter(f=>S.watched[f.id]).length;
    return `<i style="width:${done/pool.length*100}%;background:${GROUPS[gid].color}"></i>`;
  }).join("");

  const days = Math.ceil((DOOMSDAY - new Date()) / 86400000);
  const cd = $("#cdNum"), sub = $("#cdSub");
  if (days > 0){
    cd.textContent = days;
    const perWeek = left>0 ? (left/60) / (days/7) : 0;
    sub.textContent = left>0
      ? `≈ ${(Math.round(perWeek*10)/10)}h of Marvel per week to finish`
      : `You're done. Go see the movie.`;
  } else {
    cd.textContent = "IT'S TIME";
    cd.style.fontSize = "clamp(24px,5vw,40px)";
    sub.textContent = "Avengers: Doomsday is out.";
  }
}

/* the two name fields are the only inputs not rebuilt by render(), so keep
   them in step with state, but never fight whoever is currently typing */
function syncNameInputs(){
  for (const who of ["a","b"]){
    const sw = $("#color" + who.toUpperCase());
    if (sw && sw !== document.activeElement && sw.value !== S.colors[who]) sw.value = S.colors[who];
    const inp = $("#name" + who.toUpperCase());
    if (inp && inp !== document.activeElement && inp.value !== S.names[who]) {
      inp.value = S.names[who];
    }
  }
}

function render(){
  renderHeader();
  applyColors();
  syncNameInputs();
  if (VIEW==="movies") renderMovies();
  else if (VIEW==="leaderboard") renderLeaderboard();
  else renderStats();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* input fires continuously while dragging, so update locally only and let the
   change event (fired on release) do the single server write */

  setScore(sl.dataset.id, sl.dataset.who, parseFloat(sl.value), true);
});

  const sl = e.target.closest(".slider");

document.addEventListener("click", e => {
  const clr = e.target.closest("[data-clr]");

  const wb = e.target.closest("[data-watch]");
  if (wb){
    const id = wb.dataset.watch;
    S.watched[id] = !S.watched[id];

      $("#view-"+v).classList.toggle("hide", v!==VIEW));

/* ============================================================
   SHARED BOARD
   ============================================================ */
function setStatus(next){
  SYNC.status = next;
  const el = $("#syncPill");
  if (!el) return;
  // nothing worth saying when you are not sharing; the pill is only useful
  // once there is a connection that could be up or down
  if (next === "local"){ el.hidden = true; return; }
  el.hidden = false;
  const label = {
    connecting: ["Connecting",   "Loading the shared board"],
    shared:     ["Shared",       "Tap to show the link to send"],
    error:      ["Not synced",   "Could not reach the server, retrying"],
  }[next] || ["", ""];
  el.className = "syncpill " + next;
  el.title = label[1];
  el.querySelector("span").textContent = label[0];
}

/* Server is authoritative for scores, names and watch marks. The view options
   (order, filters) stay personal, so they are never sent or overwritten. */
async function pull(){
  if (!SYNC.room || SYNC.pulling) return;
  if (SYNC.queue.length){
    await flush();
    if (SYNC.queue.length) return;   // still unsent: keep local edits on screen
  }
  SYNC.pulling = true;
  try{
    const res = await fetch(`/api/room?code=${encodeURIComponent(SYNC.room)}`);
    if (res.status === 404){
      setStatus("error");
      alert("That shared board no longer exists. You are back on a local board.");
      leaveRoom();
      return;
    }
    if (!res.ok) throw new Error(res.status);
    const { state } = await res.json();
    const focused = document.activeElement;
    const typingName = focused && focused.classList.contains("nameinput");

    const fingerprint = o => JSON.stringify(o);
    const before = fingerprint([S.names, S.colors, S.scores, S.watched]);
    if (!typingName) S.names = state.names;         // don't yank the field mid-edit
    if (state.colors) S.colors = state.colors;
    S.scores  = state.scores;
    S.watched = state.watched;

    // most polls find nothing new; re-rendering anyway rebuilt every poster
    if (fingerprint([S.names, S.colors, S.scores, S.watched]) !== before){
      save(); render();
    }
    setStatus("shared");
  }catch(err){
    console.warn("pull failed", err);
    setStatus("error");
  }finally{
    SYNC.pulling = false;
  }
}

function shareURL(code){
  return `${location.origin}${location.pathname}#r=${code}`;
}

/* On a phone this opens the OS share sheet, so the link can go straight into
   Messages. Everywhere else it falls back to the clipboard. */
async function sendLink(){
  const url = shareURL(SYNC.room);
  if (navigator.share){
    try { await navigator.share({ title: "Road to Doomsday", text: "Our Marvel scoreboard", url }); return "shared"; }
    catch(e){ if (e.name === "AbortError") return "cancelled"; }
  }
  try { await navigator.clipboard.writeText(url); } catch(e){}
  return "copied";
}

async function createRoom(){
  const btn = $("#shareBtn");
  btn.disabled = true; btn.textContent = "Creating...";
  try{
    const res = await fetch("/api/room", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ state: {names:S.names, colors:S.colors, scores:S.scores, watched:S.watched} })
    });
    if (res.status === 503){
      alert("Sharing is not set up on this deployment yet. The site owner needs to add a Redis integration in Vercel.");
      return;
    }
    if (!res.ok) throw new Error(res.status);
    const { code } = await res.json();
    SYNC.room = code;
    history.replaceState(null, "", `#r=${code}`);
    save();                                   // re-key the local cache to this room
    setStatus("shared");
    renderShare(true);                        // show it once, right after creating
    startSync();
    btn.style.display = "none";
    $("#footNote").textContent = "Shared board, synced for everyone with the link.";
    $("#sharebox").scrollIntoView({ behavior:"smooth", block:"center" });
    sendLink();                               // straight to the share sheet
  }catch(err){
    console.error(err);
    alert("Could not create a shared board. Check your connection and try again.");
  }finally{
    btn.disabled = false; btn.textContent = "Share";
  }
}

function leaveRoom(){
  history.replaceState(null, "", location.pathname);
  location.reload();
}

function renderShare(open = false){
  const box = $("#sharebox");
  box.hidden = !(SYNC.room && open);
  $("#syncPill").classList.toggle("open", !box.hidden);
  if (SYNC.room){
    box.innerHTML = `
      <div class="share-row">
        <input id="shareLink" class="share-link" readonly value="${esc(shareURL(SYNC.room))}">
        <button class="ctrl shareBtn" id="copyBtn">${navigator.share ? "Send link" : "Copy link"}</button>
        <button class="ctrl" id="leaveBtn">Stop sharing</button>
      </div>
      <div class="share-note">Anyone with this link can see and change these scores. Board code <b>${esc(SYNC.room)}</b>.</div>`;
    $("#copyBtn").addEventListener("click", async () => {
      const b = $("#copyBtn"), label = b.textContent;
      const how = await sendLink();
      if (how === "copied"){ b.textContent = "Copied"; setTimeout(()=>b.textContent = label, 1500); }
    });
    $("#leaveBtn").addEventListener("click", () => {
      if (confirm("Stop syncing on this device? The shared board keeps existing, and this link will bring you back.")) leaveRoom();
    });
  } else {
    box.innerHTML = "";
  }
}

/* boot */
applyColors();
$("#orderSel").value = S.order;
$("#filterSel").value = S.filter;
$("#universeSel").value = S.universe;
$("#formatSel").value = S.format;
render();
setInterval(renderHeader, 60000);

$("#shareBtn").addEventListener("click", createRoom);
$("#syncPill").addEventListener("click", () => {
  if (!SYNC.room) return;
  renderShare($("#sharebox").hidden);      // toggle
});
renderShare();
setStatus(SYNC.status);

function startSync(){
  if (SYNC.started) return;
  SYNC.started = true;
  pull();
  setInterval(pull, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
  window.addEventListener("online", pull);
  window.addEventListener("beforeunload", e => {
    if (SYNC.queue.length){ e.preventDefault(); e.returnValue = ""; }
  });
}

if (SYNC.room){
  $("#shareBtn").style.display = "none";
  $("#footNote").textContent = "Shared board, synced for everyone with the link.";
  startSync();
}
</script>
</body>
</html>
